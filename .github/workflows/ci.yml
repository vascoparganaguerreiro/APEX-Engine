name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, staging]

# Read-only token; CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Test-only placeholders. No real project, key or secret is used or needed:
      # tests use fakes and the build only inlines these public names.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Exact version the project was verified with. The tests rely on Node's
          # built-in TypeScript type stripping, so do not lower this below 22.18.
          node-version: "26.13.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
